version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ulpf
      POSTGRES_PASSWORD: ulpf
      POSTGRES_DB: ulpf
    volumes:
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
    - redis_data:/data
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
    - minio_data:/data
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
    - discovery.type=single-node
    - bootstrap.memory_lock=false
    - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    - DISABLE_SECURITY_PLUGIN=true
    - node.store.allow_mmap=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
    - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xmx256M -Xms256M
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
    - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xmx400M -Xms400M
    restart: unless-stopped
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_started
    command: 'bash -c " echo ''Waiting for Kafka to be ready...'' && cub kafka-ready
      -b kafka:29092 1 20 && kafka-topics --create --if-not-exists --bootstrap-server
      kafka:29092 --partitions 1 --replication-factor 1 --topic ulpf_ingest && echo
      ''Topic ulpf_ingest created.'' "

      '
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ulpf:ulpf@postgres:5432/ulpf}
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: minio:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPEN_KEY_1: ${OPEN_KEY_1:-}
      OPEN_KEY_2: ${OPEN_KEY_2:-}
      OPEN_KEY_3: ${OPEN_KEY_3:-}
      OPEN_KEY_4: ${OPEN_KEY_4:-}
      OPEN_KEY_5: ${OPEN_KEY_5:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      AI_ENABLED: ${AI_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      SECRET_KEY: ${SECRET_KEY:-ulpf-change-me-in-production}
    restart: unless-stopped
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ulpf:ulpf@postgres:5432/ulpf}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPEN_KEY_1: ${OPEN_KEY_1:-}
    restart: unless-stopped
  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    depends_on:
    - backend
    environment:
      NEXT_PUBLIC_API_URL: ''
      BACKEND_URL: http://backend:8000
    restart: unless-stopped
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
    - frontend
    - backend
    ports:
    - '80:80'
    restart: unless-stopped
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  opensearch_data: null
